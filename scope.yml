targets:
  - name: google
    platform: bounty
    disclosure: https://bughunters.google.com/about/rules
    bounty: true
    program_url: https://bughunters.google.com/about/rules
    domains: [google.com, "*.google.com"]
    github_orgs: [google]
  - name: microsoft
    platform: bounty
    disclosure: https://www.microsoft.com/en-us/msrc/bounty
    bounty: true
    program_url: https://www.microsoft.com/en-us/msrc/bounty
    domains: [microsoft.com, "*.microsoft.com", "*.azure.com"]
    github_orgs: [microsoft]
probe_allow: "google|microsoft|azure|live|office|bing|msn"
