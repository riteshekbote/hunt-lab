name: Public Repo Deep Scan (google + microsoft orgs)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reposcan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: reposcan
      cancel-in-progress: true
    env:
      MODEL_ID: opencode/nemotron-3-ultra-free

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          opencode --version

      - name: Enumerate org repos + clone top candidates
        run: |
          mkdir -p reposcan-raw
          for ORG in google microsoft; do
            echo "== $ORG =="
            curl -s "https://api.github.com/orgs/$ORG/repos?per_page=100&sort=updated" -o repos-$ORG.json
            ORG_NAME=$ORG python3 - << 'PY'
          import json, os
          org = os.environ["ORG_NAME"]
          try:
              repos = json.load(open(f"repos-{org}.json"))
          except Exception:
              exit(0)
          cands = [r for r in repos if not r.get("archived") and r.get("language")
                   and r.get("stargazers_count", 0) > 20]
          cands.sort(key=lambda r: r["updated_at"], reverse=True)
          for r in cands[:20]:
              print(f"{org}/{r['name']} stars={r['stargazers_count']} lang={r['language']}")
          with open(f"cands-{org}.txt", "w") as f:
              for r in cands[:20]:
                  f.write(f"https://github.com/{org}/{r['name']}.git\n")
          PY
            if [ -f cands-$ORG.txt ]; then
              mkdir -p reposcan-raw/$ORG
              cd reposcan-raw/$ORG
              xargs -n1 -P3 git clone -q --depth 1 2>/dev/null || true
              cd ../..
            fi
          done
          ls reposcan-raw/*/ 2>/dev/null | wc -l

      - name: Secret + endpoint grep sweep
        run: |
          OUT=reposcan-raw/grep-hits.txt
          : > $OUT
          {
            echo "SCAN SUMMARY: $(find reposcan-raw -type f -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.go' -o -name '*.java' -o -name '*.rb' -o -name '*.php' -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' 2>/dev/null | wc -l) code/config files across $(find reposcan-raw -mindepth 1 -maxdepth 2 -type d 2>/dev/null | wc -l) directories"
          } > $OUT
          # 48-pattern secret catalog (light): AWS/GCP/Azure keys, JWTs, tokens, internal URLs, debug flags
          rg -i -n --no-heading -g '!*.min.js' -g '!*.map' -g '!*.lock' -g '!node_modules' -g '!vendor' -g '!test*' -g '!*_test.*' -g '!*.png' -g '!*.jpg' -g '!*.zip' -g '!*.jar' -g '!*.pdf' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'AIza[0-9A-Za-z_-]{35}' \
            -e 'ya29\.[0-9A-Za-z_-]+' \
            -e 'gh[pousr]_[0-9A-Za-z]{20,}' \
            -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
            -e 'sk-[0-9A-Za-z]{20,}' \
            -e 'eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}' \
            -e 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY' \
            -e 'AccountKey=|[a-z0-9+/]{86}==' \
            -e 'https?://[a-z0-9.-]*(internal|corp|intranet|dev-|staging|admin|api)[a-z0-9.-]*\.' \
            -e '(password|passwd|secret|token|apikey|api_key)\s*[:=]\s*["'"'"'][^"'"'"']{8,}["'"'"']' \
            -e 'x-goog-apis-token|X-Goog-API-Key' \
            -e '(client_secret|clientSecret|app_secret|appsecret|app_secret|secret_key|private_key)\s*[:=]\s*["'"'"'][^"'"'"']{10,}["'"'"']' \
            -e '(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|GOOGLE_API_KEY|GCP_SA|AZURE_SUBSCRIPTION|SLACK_TOKEN|DISCORD_TOKEN|TELEGRAM_BOT)\s*[:=]\s*[^\s]{10,}' \
            -e '(Authorization|Bearer)\s*[:=]\s*eyJ[a-zA-Z0-9_-]{20,}' \
            -e '(\w+)-(dev|staging|stg|test|qa|prod|internal|corp)\.(googleapis|google|microsoft|azure)\.[a-z]+' \
            -e 'metadata\.google\.internal|169\.254\.169\.254|100\.100\.100\.200' \
            -e 'kind:\s*Config|kubeconfig|k8s-.*serviceaccount|service-account\.json' \
            reposcan-raw/*/ 2>/dev/null | grep -viE 'example|placeholder|dummy|sample|localhost|test\s*=|password\s*[:=]\s*["'"'"']?password' | head -80 >> $OUT
          wc -l $OUT

      - name: Model deep-dive on hits
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          cat > scan-prompt.txt << 'PROMPT_START'
          You are triaging a static scan of public repos from the google/ and
          microsoft/ GitHub orgs (both are in scope of their bounty programs as
          public source code).

          Below are grep hits (files + lines). For EACH hit classify:
          - REAL_SECRET: hardcoded credential/API key/token with signs of life
            (reportable via the program's disclosure channel after triage)
          - TEST_OR_EXAMPLE: sample/test/fixture data (not reportable)
          - ENDPOINT_LEAK: internal/dev/staging URLs, API endpoints
          - INTERESTING: anything unusual (debug flags, keys, cloud configs)
          NEVER print a full secret value - only the file, line, and a sha256 of
          the secret material.
          Output: a table per category, then a SHORT verdict list with
          "REPORT_CANDIDATE: yes/no" per real candidate.

          GREP HITS:
          PROMPT_START
          cat reposcan-raw/grep-hits.txt >> scan-prompt.txt
          timeout 15m opencode run --model "$MODEL_ID" < scan-prompt.txt > reposcan-raw/analysis.txt 2>&1 || true
          echo "=== analysis preview ==="; head -30 reposcan-raw/analysis.txt

      - name: Store leads
        run: |
          mkdir -p leads
          {
            echo ""
            echo "===== REPOSCAN $(date -u +'%Y-%m-%d %H:%M:%S UTC') ====="
            echo "## Grep hits:"
            cat reposcan-raw/grep-hits.txt 2>/dev/null | head -40
            echo ""
            echo "## Model analysis:"
            cat reposcan-raw/analysis.txt 2>/dev/null | head -120
          } > leads/reposcan-latest.md
          cp leads/reposcan-latest.md leads/reposcan-$(date -u +'%Y-%m-%d-%H-%M').md 2>/dev/null || true

      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add leads reposcan-raw || true
          git diff --cached --quiet || git commit -m "reposcan $(date -u +'%Y-%m-%d-%H-%M')"
          git push || true
